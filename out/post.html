<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#fff;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#0f1419;display:flex;align-items:center;justify-content:center}
.card{width:920px}
.head{display:flex;align-items:center;gap:24px;margin-bottom:44px}
.av{width:112px;height:112px;border-radius:50%;background:#0f1419;color:#fff;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700}
.name{font-size:40px;font-weight:700;display:flex;align-items:center;gap:10px}
.badge{width:36px;height:36px;border-radius:50%;background:#1d9bf0;color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center}
.handle{font-size:34px;color:#536471;margin-top:4px}
.quote{font-size:44px;line-height:1.35;color:#0f1419;border-left:8px solid #e0242b;padding-left:28px;margin-bottom:16px}
.who{font-size:30px;color:#536471;padding-left:36px;margin-bottom:48px}
.main{font-size:64px;line-height:1.2;font-weight:800;margin-bottom:28px}
.red{color:#e0242b}
.sub{font-size:44px;line-height:1.35;margin-bottom:40px}
.ask{font-size:52px;font-weight:800}
.src{font-size:26px;color:#8b98a5;margin-top:56px}
</style></head><body><div class="card">
<div class="head"><div class="av">LC</div><div><div class="name">Levi Cabral <span class="badge">✓</span></div><div class="handle">@levicabrals</div></div></div>
<div class="quote">"Toda a programação que nós temos é para que a gente comece a reforma tributária a partir de janeiro de 2027."</div>
<div class="who">Dario Durigan, ministro da Fazenda</div>
<div class="main">A reforma <span class="red">não foi adiada.</span></div>
<div class="sub">Faltam menos de 2 meses.</div>
<div class="ask">Sua empresa está pronta ?</div>
<div class="src">Fonte: Exame, 05/11/2026</div>
</div></body></html>
